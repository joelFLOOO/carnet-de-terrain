<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carnet de terrain</title>
  <style>

    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #101a86;
      background: #f6f8f6;
    }

    h1 {
      font-size: 26px;
      border-bottom: 2px solid #0f346b;
      padding-bottom: 10px;
    }

    input {
      padding: 8px 10px;
      border: 1px solid #c3ccc6;
      border-radius: 4px;
      font-size: 15px;
      margin-right: 6px;
      margin-bottom: 8px;
    }

    button {
      padding: 8px 16px;
      background: #0f3d6b;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1e0e77;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 24px;
    }

    li {
      background: white;
      border: 1px solid #e0e6e2;
      border-left: 3px solid #090d82;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 3px;
    }

    #resume {
      margin-top: 20px;
      padding: 12px 14px;
      background: #e4efe9;
      border-radius: 4px;
      font-weight: 600;
    }
        li button {
      background: #b23b3b;
      padding: 3px 9px;
      font-size: 13px;
      margin-left: 10px;
    }

  </style>
</head>
<body>

  <h1>Carnet de terrain</h1>
  <input id="quartier" placeholder="Quartier">
  <input id="espece" placeholder="Espece">
  <input id="effectif" placeholder="Effectif">
  <button onclick="ajouter()">Ajouter</button>
  <ul id="liste"></ul>
  <p id="resume"></p>

  <script>
    let carnet = [
        { quartier: "Bonaberi", espece: "silure", effectif: 1200 },
        { quartier: "Deido", espece: "tilapia",effectif: 800 }
  ];

  function afficher() {
    let texte = "";
    let total = 0
     for (let i = 0; i < carnet.length; i = i + 1) {
    let o = carnet[i];
    texte = texte + "<li>" + o.quartier + " — " + o.espece + " : " + o.effectif
          + " <button onclick='supprimer(" + i + ")'>supprimer</button></li>";
    total = total + o.effectif;
  }
    let moyenne = total / carnet.length;
    console.log("total =", total, "moyenne =", moyenne);

    document.getElementById("liste").innerHTML = texte;
    document.getElementById("resume").textContent = "Total : " + total + " poissons — moyenne : " + moyenne;
}
function ajouter() {

  let q = document.getElementById("quartier").value;
  let e = document.getElementById("espece").value;
  let n = Number(document.getElementById("effectif").value);

  let fiche = { quartier: q, espece: e, effectif: n };

  carnet.push(fiche);
  afficher();
  sauvegarder();

  document.getElementById("quartier").value = "";
  document.getElementById("espece").value = "";
  document.getElementById("effectif").value = "";
}

function sauvegarder(){
    localStorage.setItem("carnet", JSON.stringify(carnet));
}
function supprimer(i) {
  carnet.splice(i, 1);
  afficher()
  sauvegarder()
}
  let sauvegarde = localStorage.getItem("carnet");

  if (sauvegarde) {
  carnet = JSON.parse(sauvegarde);
}

  afficher();
  
  </script>

</body>
</html>
